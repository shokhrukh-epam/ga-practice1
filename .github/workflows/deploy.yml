name: Deploy project
on: push
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Run tests
              run: npm run test
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Run tests
              run: npm run test
            - name: Run build
              run: npm run build
            - name: Deploy code
              run: echo "Deploying..."
