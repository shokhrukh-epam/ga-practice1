name: Deploy project
on: push
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm lint
    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm lint
            - name: Run tests
              run: npm test
    build:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm lint
            - name: Run tests
              run: npm test
            - name: Run build
              run: npm build

